name: Android EN Build

on:
  push:
    branches:
      - dev-rylynnua
      - master
      - main
    paths:
      - "android_en/**"
      - ".github/workflows/android-en-build.yml"
  pull_request:
    branches:
      - dev-rylynnua
      - master
      - main
    paths:
      - "android_en/**"
      - ".github/workflows/android-en-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build android_en APKs
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android_en

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleNormalDebug

      - name: Prepare signed keystore
        if: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > upload-ci.keystore

      - name: Build signed upload APK
        if: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: upload-ci.keystore
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleNormalUpload

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-en-debug-apk
          path: android_en/app/build/outputs/apk/normal/debug/app-normal-debug.apk
          if-no-files-found: error

      - name: Upload signed APK artifact
        if: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-en-signed-upload-apk
          path: android_en/app/build/outputs/apk/normal/upload/app-normal-upload.apk
          if-no-files-found: error
